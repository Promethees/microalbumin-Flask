services:
  - type: web
    name: easyokapi-auth
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -k eventlet --workers 1 main:app
    plan: free
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: APP_BASE_URL
        value: https://easyokapi-auth.onrender.com
      - key: APP_RELEASE_TAG
        value: v1.0.5
      - key: GITHUB_PAT
        sync: false       # set manually in Render dashboard
      - key: GITHUB_OWNER
        value: Promethees
      - key: GITHUB_REPO
        value: microalbumin-Flask
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false       # set manually in Render dashboard
      - key: SMTP_PASS
        sync: false       # set manually in Render dashboard
      - key: DATABASE_URL
        fromDatabase:
          name: easyokapi-db
          property: connectionString

databases:
  - name: easyokapi-db
    plan: free
    databaseName: easyokapi
    user: easyokapi
