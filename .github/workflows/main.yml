name: CI/CD Build and Test

# To save Actions minutes, a plain push to main does NOT build. The build +
# release pipeline runs only when a version tag (v*) is pushed. Pull requests and
# manual dispatch still run the cheap test job for feedback, but not the builds.
on:
  push:
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  # Fallback version used on non-tag branch builds (CI smoke runs)
  APP_VERSION_FALLBACK: "1.3.8"
  AUTH_BASE_URL: ${{ secrets.AUTH_BASE_URL }}
  # No-source freeze toggle (P3). Set repository variable ENCODE_SOURCE=true to
  # additionally build + smoke-test the PyInstaller onedir bundle and publish the
  # EasyOKAPI-bundle-<plat> update artifacts. Defaults to 'false' so the existing
  # source installer pipeline is unchanged until you opt in.
  ENCODE_SOURCE: ${{ vars.ENCODE_SOURCE || 'false' }}

jobs:
  # ── Compute version ────────────────────────────────────────────────────────
  # Outputs the version derived from the git tag when triggered by a tag push,
  # or falls back to APP_VERSION_FALLBACK for branch/PR runs.
  setup:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      bare_version: ${{ steps.ver.outputs.bare_version }}
      encode_source: ${{ steps.flag.outputs.encode_source }}
    steps:
      - name: Compute version
        id: ver
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            VERSION="${{ github.ref_name }}"
          else
            VERSION="v${{ env.APP_VERSION_FALLBACK }}"
          fi
          BARE="${VERSION#v}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "bare_version=${BARE}" >> $GITHUB_OUTPUT

      - name: Resolve ENCODE_SOURCE flag
        id: flag
        run: echo "encode_source=${{ env.ENCODE_SOURCE }}" >> $GITHUB_OUTPUT

  # ── Tests ──────────────────────────────────────────────────────────────────
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.8'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests
        env:
          PYTHONPATH: .:${{ github.workspace }}/src
        run: |
          pytest

  # ── macOS build ────────────────────────────────────────────────────────────
  build-macos:
    needs: [setup, test]
    if: github.ref_type == 'tag'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # ── Source installer (skipped on full no-source cutover, ENCODE_SOURCE=true) ─
      - name: Inject version and auth URL into installer scripts
        if: needs.setup.outputs.encode_source != 'true'
        run: |
          sed -i '' "s/__APP_VERSION__/${{ needs.setup.outputs.version }}/g" installer-mac/setup.sh
          sed -i '' "s|__AUTH_BASE_URL__|${{ env.AUTH_BASE_URL }}|g" installer-mac/setup.sh

      - name: Build DMG
        if: needs.setup.outputs.encode_source != 'true'
        env:
          APP_VERSION: ${{ needs.setup.outputs.bare_version }}
        run: |
          chmod +x ./installer-mac/build-dmg.sh
          ./installer-mac/build-dmg.sh

      - name: Upload DMG artifact
        if: needs.setup.outputs.encode_source != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: EasyOKAPI-mac-${{ needs.setup.outputs.version }}
          path: "*.dmg"

      # ── No-source frozen bundle (gated by ENCODE_SOURCE) ────────────────────
      - name: Set up Python (frozen build)
        if: needs.setup.outputs.encode_source == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.8'

      - name: Build frozen bundle (PyInstaller)
        if: needs.setup.outputs.encode_source == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-build.txt
          python tools/package.py --encode

      - name: Smoke test frozen bundle (/ping)
        if: needs.setup.outputs.encode_source == 'true'
        run: |
          ./dist/EasyOKAPI/EasyOKAPI --port 5099 --alias 127.0.0.1 &
          APP_PID=$!
          ok=0
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:5099/ping >/dev/null 2>&1; then ok=1; break; fi
            sleep 1
          done
          # Also assert a bundled vendor asset is served — catches a static/vendor
          # tree missing from the freeze (the UI would otherwise break silently).
          vendor=0
          if [ "$ok" = "1" ] && curl -fsS http://127.0.0.1:5099/static/vendor/jquery-3.6.0.min.js >/dev/null 2>&1; then
            vendor=1
          fi
          kill "$APP_PID" 2>/dev/null || true
          if [ "$ok" != "1" ]; then echo "Smoke test failed: /ping never returned 200"; exit 1; fi
          if [ "$vendor" != "1" ]; then echo "Smoke test failed: bundled vendor asset not served (static/vendor missing)"; exit 1; fi
          echo "Smoke test passed (/ping + vendor asset)."

      # uninstall.command sits in Contents/Resources/ — one level ABOVE the dir the
      # in-app update swaps (Resources/EasyOKAPI/) — so an update never refreshed
      # it. Ship it inside the bundle; the posix swap script copies it up into the
      # parent after swapping. (Drag-to-Trash removal is unaffected either way.)
      - name: Bundle uninstall.command for the update bundle
        if: needs.setup.outputs.encode_source == 'true'
        run: |
          cp installer-mac/uninstall.command dist/EasyOKAPI/uninstall.command
          chmod +x dist/EasyOKAPI/uninstall.command

      - name: Package update bundle
        if: needs.setup.outputs.encode_source == 'true'
        run: tar -C dist -czf EasyOKAPI-bundle-mac.tar.gz EasyOKAPI

      - name: Upload bundle artifact
        if: needs.setup.outputs.encode_source == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: EasyOKAPI-bundle-mac-${{ needs.setup.outputs.version }}
          path: EasyOKAPI-bundle-mac.tar.gz

      - name: Build no-source DMG (embeds the frozen binary)
        if: needs.setup.outputs.encode_source == 'true'
        env:
          APP_VERSION: ${{ needs.setup.outputs.bare_version }}
        run: |
          chmod +x ./installer-mac/build-dmg-frozen.sh
          ./installer-mac/build-dmg-frozen.sh

      - name: Upload no-source DMG artifact
        if: needs.setup.outputs.encode_source == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: EasyOKAPI-mac-frozen-${{ needs.setup.outputs.version }}
          path: "*.dmg"

  # ── Windows build ──────────────────────────────────────────────────────────
  build-windows:
    needs: [setup, test]
    if: github.ref_type == 'tag'
    runs-on: windows-latest
    env:
      APP_VERSION: ${{ needs.setup.outputs.bare_version }}
    steps:
      - uses: actions/checkout@v4

      # ── Source installer (skipped on full no-source cutover, ENCODE_SOURCE=true) ─
      - name: Inject version and auth URL into installer scripts
        if: needs.setup.outputs.encode_source != 'true'
        shell: pwsh
        run: |
          $v   = "${{ needs.setup.outputs.version }}"
          $url = "${{ env.AUTH_BASE_URL }}"
          if (-not $url) {
            Write-Error "AUTH_BASE_URL secret is not set. Add it under Settings → Secrets → Actions."
            exit 1
          }
          $f   = "installer-win\startwindow-0-clone-repo.bat"
          $content = (Get-Content $f -Raw -Encoding utf8).Replace('__APP_VERSION__', $v).Replace('__AUTH_BASE_URL__', $url)
          [System.IO.File]::WriteAllText($f, $content, [System.Text.UTF8Encoding]::new($false))
          if ($content -match '__APP_VERSION__|__AUTH_BASE_URL__') {
            Write-Error "Placeholder replacement failed. Content still contains unreplaced tokens."
            exit 1
          }
          Write-Host "Injected version=$v and AUTH_BASE_URL=$($url.Substring(0, [Math]::Min(20,$url.Length)))..."

      - name: Install NSIS
        run: |
          choco install nsis -y
          echo "C:\Program Files (x86)\NSIS" >> $env:GITHUB_PATH

      - name: Generate installer bitmaps
        shell: pwsh
        run: |
          pip install Pillow --quiet
          python installer-win/build-bitmaps.py

      - name: Build Runner and Installer
        if: needs.setup.outputs.encode_source != 'true'
        shell: pwsh
        run: |
          Set-Location installer-win
          & makensis runner.nsi
          & makensis "/DAPP_VERSION=$env:APP_VERSION" "/DAUTH_BASE_URL=$env:AUTH_BASE_URL" setup.nsi

      - name: Upload EXE artifact
        if: needs.setup.outputs.encode_source != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: EasyOKAPI-win-${{ needs.setup.outputs.version }}
          path: installer-win/EasyOKAPI_Setup_${{ needs.setup.outputs.bare_version }}.exe

      # ── No-source frozen bundle (gated by ENCODE_SOURCE) ────────────────────
      - name: Set up Python (frozen build)
        if: needs.setup.outputs.encode_source == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.8'

      - name: Build frozen bundle (PyInstaller)
        if: needs.setup.outputs.encode_source == 'true'
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-build.txt
          python tools/package.py --encode

      - name: Smoke test frozen bundle (/ping)
        if: needs.setup.outputs.encode_source == 'true'
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist\EasyOKAPI\EasyOKAPI.exe" -ArgumentList '--port','5099','--alias','127.0.0.1' -PassThru
          $ok = $false
          for ($i = 0; $i -lt 30; $i++) {
            try { Invoke-WebRequest 'http://127.0.0.1:5099/ping' -UseBasicParsing -TimeoutSec 2 | Out-Null; $ok = $true; break }
            catch { Start-Sleep -Seconds 1 }
          }
          # Also assert a bundled vendor asset is served (static/vendor in the freeze).
          $vendor = $false
          if ($ok) {
            try { Invoke-WebRequest 'http://127.0.0.1:5099/static/vendor/jquery-3.6.0.min.js' -UseBasicParsing -TimeoutSec 5 | Out-Null; $vendor = $true } catch {}
          }
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          if (-not $ok) { Write-Error 'Smoke test failed: /ping never returned 200'; exit 1 }
          if (-not $vendor) { Write-Error 'Smoke test failed: bundled vendor asset not served (static/vendor missing)'; exit 1 }
          Write-Host 'Smoke test passed (/ping + vendor asset).'

      # Uninstall.exe lives inside the swapped directory, so without a copy in the
      # update bundle an in-app update can only carry the OLD uninstaller across and
      # every updated install keeps the uninstaller it was first installed with,
      # forever. NSIS only emits an uninstaller by RUNNING an installer, so compile
      # setup-frozen.nsi in its UNINSTALLER_ONLY mode (a tiny silent stub, no
      # payload) and run that. Same script as the real installer, so the uninstaller
      # is identical — nothing to drift. Must run BEFORE the bundle is zipped below.
      - name: Generate Uninstall.exe for the update bundle
        if: needs.setup.outputs.encode_source == 'true'
        shell: pwsh
        run: |
          Set-Location installer-win
          makensis "/DAPP_VERSION=$env:APP_VERSION" /DUNINSTALLER_ONLY setup-frozen.nsi
          if (-not (Test-Path 'make-uninstaller.exe')) {
            Write-Error 'UNINSTALLER_ONLY build produced no make-uninstaller.exe'; exit 1
          }
          # /D= must be the LAST argument and unquoted, so keep the path space-free.
          $out = 'C:\uninst-out'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          $p = Start-Process -FilePath (Resolve-Path 'make-uninstaller.exe') `
                             -ArgumentList '/S', "/D=$out" -Wait -PassThru
          $u = Join-Path $out 'Uninstall.exe'
          # Assert rather than trust: if this silently produced nothing, the swap
          # script's fallback would quietly carry the old uninstaller across again
          # and the regression would ship unnoticed.
          if (-not (Test-Path $u)) {
            Write-Error "Stub exited $($p.ExitCode) but wrote no Uninstall.exe to $out"; exit 1
          }
          Copy-Item $u '..\dist\EasyOKAPI\Uninstall.exe' -Force
          Remove-Item 'make-uninstaller.exe' -Force
          Write-Host "Bundled Uninstall.exe ($((Get-Item '..\dist\EasyOKAPI\Uninstall.exe').Length) bytes)"

      - name: Package update bundle
        if: needs.setup.outputs.encode_source == 'true'
        shell: pwsh
        run: Compress-Archive -Path "dist\EasyOKAPI" -DestinationPath "EasyOKAPI-bundle-win.zip" -Force

      - name: Upload bundle artifact
        if: needs.setup.outputs.encode_source == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: EasyOKAPI-bundle-win-${{ needs.setup.outputs.version }}
          path: EasyOKAPI-bundle-win.zip

      - name: Build no-source installer (NSIS, embeds the frozen binary)
        if: needs.setup.outputs.encode_source == 'true'
        shell: pwsh
        run: |
          Set-Location installer-win
          makensis "/DAPP_VERSION=$env:APP_VERSION" setup-frozen.nsi

      - name: Upload no-source installer artifact
        if: needs.setup.outputs.encode_source == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: EasyOKAPI-win-frozen-${{ needs.setup.outputs.version }}
          path: installer-win/EasyOKAPI_Setup_*.exe

  # ── Linux build ────────────────────────────────────────────────────────────
  build-linux:
    needs: [setup, test]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ── Source installer (skipped on full no-source cutover, ENCODE_SOURCE=true) ─
      - name: Inject version and auth URL into installer scripts
        if: needs.setup.outputs.encode_source != 'true'
        run: |
          sed -i "s/__APP_VERSION__/${{ needs.setup.outputs.version }}/g" installer-linux/install.sh
          sed -i "s|__AUTH_BASE_URL__|${{ env.AUTH_BASE_URL }}|g" installer-linux/install.sh
          sed -i "s/__APP_VERSION__/${{ needs.setup.outputs.version }}/g" installer-linux/install-1-deps-clone.sh
          sed -i "s|__AUTH_BASE_URL__|${{ env.AUTH_BASE_URL }}|g" installer-linux/install-1-deps-clone.sh

      - name: Build Linux tarball
        if: needs.setup.outputs.encode_source != 'true'
        env:
          APP_VERSION: ${{ needs.setup.outputs.bare_version }}
        run: |
          chmod +x ./installer-linux/build-tarball.sh
          ./installer-linux/build-tarball.sh

      - name: Upload tarball artifact
        if: needs.setup.outputs.encode_source != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: EasyOKAPI-linux-${{ needs.setup.outputs.version }}
          path: "*.tar.gz"

      # ── No-source frozen bundle (gated by ENCODE_SOURCE) ────────────────────
      - name: Set up Python (frozen build)
        if: needs.setup.outputs.encode_source == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.8'

      - name: Build frozen bundle (PyInstaller)
        if: needs.setup.outputs.encode_source == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-build.txt
          python tools/package.py --encode

      - name: Smoke test frozen bundle (/ping)
        if: needs.setup.outputs.encode_source == 'true'
        run: |
          ./dist/EasyOKAPI/EasyOKAPI --port 5099 --alias 127.0.0.1 &
          APP_PID=$!
          ok=0
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:5099/ping >/dev/null 2>&1; then ok=1; break; fi
            sleep 1
          done
          # Also assert a bundled vendor asset is served — catches a static/vendor
          # tree missing from the freeze (the UI would otherwise break silently).
          vendor=0
          if [ "$ok" = "1" ] && curl -fsS http://127.0.0.1:5099/static/vendor/jquery-3.6.0.min.js >/dev/null 2>&1; then
            vendor=1
          fi
          kill "$APP_PID" 2>/dev/null || true
          if [ "$ok" != "1" ]; then echo "Smoke test failed: /ping never returned 200"; exit 1; fi
          if [ "$vendor" != "1" ]; then echo "Smoke test failed: bundled vendor asset not served (static/vendor missing)"; exit 1; fi
          echo "Smoke test passed (/ping + vendor asset)."

      # uninstall.sh is installed at /opt/EasyOKAPI/uninstall.sh — one level ABOVE
      # the dir the in-app update swaps — so an update never refreshed it and an
      # install predating it never got one. Ship it inside the bundle; the posix
      # swap script copies it up into the parent after swapping.
      - name: Bundle uninstall.sh for the update bundle
        if: needs.setup.outputs.encode_source == 'true'
        run: |
          cp installer-linux/uninstall.sh dist/EasyOKAPI/uninstall.sh
          chmod +x dist/EasyOKAPI/uninstall.sh

      - name: Package update bundle
        if: needs.setup.outputs.encode_source == 'true'
        # The onedir folder is renamed to avoid colliding with the installer
        # tarball's own '*.tar.gz' glob in the upload above.
        run: tar -C dist -czf EasyOKAPI-bundle-linux.tar.gz EasyOKAPI

      - name: Upload bundle artifact
        if: needs.setup.outputs.encode_source == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: EasyOKAPI-bundle-linux-${{ needs.setup.outputs.version }}
          path: EasyOKAPI-bundle-linux.tar.gz

      - name: Build no-source tarball (embeds the frozen binary)
        if: needs.setup.outputs.encode_source == 'true'
        env:
          APP_VERSION: ${{ needs.setup.outputs.bare_version }}
        run: |
          chmod +x ./installer-linux/build-tarball-frozen.sh
          ./installer-linux/build-tarball-frozen.sh

      - name: Upload no-source tarball artifact
        if: needs.setup.outputs.encode_source == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: EasyOKAPI-linux-frozen-${{ needs.setup.outputs.version }}
          path: "*_linux_*.tar.gz"

  # ── Release ────────────────────────────────────────────────────────────────
  # Runs on every v* tag push, including force-pushed tag updates.
  # Creates the release on first push; on re-push it updates the metadata
  # and replaces all assets via --clobber so the release always reflects
  # the artifacts built at the current tag commit.
  release:
    needs: [setup, build-macos, build-windows, build-linux]
    runs-on: ubuntu-latest
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    permissions:
      contents: write
    steps:
      # ── Source installers (published only when NOT doing the no-source cutover) ──
      - name: Download macOS artifact
        if: needs.setup.outputs.encode_source != 'true'
        uses: actions/download-artifact@v4
        with:
          name: EasyOKAPI-mac-${{ needs.setup.outputs.version }}
          path: dist/

      - name: Download Windows artifact
        if: needs.setup.outputs.encode_source != 'true'
        uses: actions/download-artifact@v4
        with:
          name: EasyOKAPI-win-${{ needs.setup.outputs.version }}
          path: dist/

      - name: Download Linux artifact
        if: needs.setup.outputs.encode_source != 'true'
        uses: actions/download-artifact@v4
        with:
          name: EasyOKAPI-linux-${{ needs.setup.outputs.version }}
          path: dist/

      # ── Frozen no-source installers (gated) — the public download in cutover mode ──
      - name: Download macOS frozen installer
        if: needs.setup.outputs.encode_source == 'true'
        uses: actions/download-artifact@v4
        with:
          name: EasyOKAPI-mac-frozen-${{ needs.setup.outputs.version }}
          path: dist/

      - name: Download Windows frozen installer
        if: needs.setup.outputs.encode_source == 'true'
        uses: actions/download-artifact@v4
        with:
          name: EasyOKAPI-win-frozen-${{ needs.setup.outputs.version }}
          path: dist/

      - name: Download Linux frozen installer
        if: needs.setup.outputs.encode_source == 'true'
        uses: actions/download-artifact@v4
        with:
          name: EasyOKAPI-linux-frozen-${{ needs.setup.outputs.version }}
          path: dist/

      # ── Frozen update bundles (gated) — consumed by the in-app swap updater ──
      - name: Download macOS bundle
        if: needs.setup.outputs.encode_source == 'true'
        uses: actions/download-artifact@v4
        with:
          name: EasyOKAPI-bundle-mac-${{ needs.setup.outputs.version }}
          path: dist/

      - name: Download Windows bundle
        if: needs.setup.outputs.encode_source == 'true'
        uses: actions/download-artifact@v4
        with:
          name: EasyOKAPI-bundle-win-${{ needs.setup.outputs.version }}
          path: dist/

      - name: Download Linux bundle
        if: needs.setup.outputs.encode_source == 'true'
        uses: actions/download-artifact@v4
        with:
          name: EasyOKAPI-bundle-linux-${{ needs.setup.outputs.version }}
          path: dist/

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Easy OKAPI ${{ github.ref_name }}"
          generate_release_notes: true
          make_latest: true

      - name: Upload release assets (replace existing on re-push)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for f in dist/*; do
            gh release upload "${{ github.ref_name }}" "$f" \
              --clobber \
              --repo "${{ github.repository }}"
          done
