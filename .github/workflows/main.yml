name: CI/CD Build and Test

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  APP_VERSION: "1.0.4"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.8'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        env:
          PYTHONPATH: .:${{ github.workspace }}/src
        run: |
          pytest

  build-macos:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Inject version into installer scripts
        run: |
          sed -i '' "s/__APP_VERSION__/v${{ env.APP_VERSION }}/g" installer-mac/install-tools-clone-repo.command

      - name: Build DMG
        env:
          APP_VERSION: ${{ env.APP_VERSION }}
        run: |
          chmod +x ./installer-mac/build-dmg.sh
          ./installer-mac/build-dmg.sh

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: EasyOKAPI-mac-v${{ env.APP_VERSION }}
          path: "*.dmg"

  build-windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Inject version into installer scripts
        shell: pwsh
        run: |
          $v = "v${{ env.APP_VERSION }}"
          (Get-Content installer-win\startwindow-0-clone-repo.bat -Raw) -replace '__APP_VERSION__', $v |
            Set-Content installer-win\startwindow-0-clone-repo.bat

      - name: Install NSIS
        run: |
          choco install nsis -y
          echo "C:\Program Files (x86)\NSIS" >> $env:GITHUB_PATH

      - name: Build Runner and Installer
        shell: cmd
        run: |
          cd installer-win
          makensis runner.nsi
          makensis /DAPP_VERSION=${{ env.APP_VERSION }} setup.nsi

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: EasyOKAPI-win-v${{ env.APP_VERSION }}
          path: installer-win/*.exe

  build-linux:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Inject version into installer scripts
        run: |
          sed -i "s/__APP_VERSION__/v${{ env.APP_VERSION }}/g" installer-linux/install.sh
          sed -i "s/__APP_VERSION__/v${{ env.APP_VERSION }}/g" installer-linux/install-1-deps-clone.sh

      - name: Build Linux tarball
        env:
          APP_VERSION: ${{ env.APP_VERSION }}
        run: |
          chmod +x ./installer-linux/build-tarball.sh
          ./installer-linux/build-tarball.sh

      - name: Upload tarball artifact
        uses: actions/upload-artifact@v4
        with:
          name: EasyOKAPI-linux-v${{ env.APP_VERSION }}
          path: "*.tar.gz"
