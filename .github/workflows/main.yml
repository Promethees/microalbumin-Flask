name: CI/CD Build and Test

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  APP_VERSION: "1.0.8"
  # Base URL of the deployed auth/download service (set as a repo secret)
  AUTH_BASE_URL: ${{ secrets.AUTH_BASE_URL }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.8'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        env:
          PYTHONPATH: .:${{ github.workspace }}/src
        run: |
          pytest

  build-macos:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Inject version and auth URL into installer scripts
        run: |
          sed -i '' "s/__APP_VERSION__/v${{ env.APP_VERSION }}/g" installer-mac/install-tools-clone-repo.command
          sed -i '' "s|__AUTH_BASE_URL__|${{ env.AUTH_BASE_URL }}|g" installer-mac/install-tools-clone-repo.command

      - name: Build DMG
        env:
          APP_VERSION: ${{ env.APP_VERSION }}
        run: |
          chmod +x ./installer-mac/build-dmg.sh
          ./installer-mac/build-dmg.sh

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: EasyOKAPI-mac-v${{ env.APP_VERSION }}
          path: "*.dmg"

  build-windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Inject version and auth URL into installer scripts
        shell: pwsh
        run: |
          $v   = "v${{ env.APP_VERSION }}"
          $url = "${{ env.AUTH_BASE_URL }}"
          if (-not $url) {
            Write-Error "AUTH_BASE_URL secret is not set. Add it under Settings → Secrets → Actions."
            exit 1
          }
          $f   = "installer-win\startwindow-0-clone-repo.bat"
          $content = (Get-Content $f -Raw -Encoding utf8).Replace('__APP_VERSION__', $v).Replace('__AUTH_BASE_URL__', $url)
          [System.IO.File]::WriteAllText($f, $content, [System.Text.UTF8Encoding]::new($false))
          # Verify placeholders were replaced
          if ($content -match '__APP_VERSION__|__AUTH_BASE_URL__') {
            Write-Error "Placeholder replacement failed. Content still contains unreplaced tokens."
            exit 1
          }
          Write-Host "Injected version=$v and AUTH_BASE_URL=$($url.Substring(0, [Math]::Min(20,$url.Length)))..."

      - name: Install NSIS
        run: |
          choco install nsis -y
          echo "C:\Program Files (x86)\NSIS" >> $env:GITHUB_PATH

      - name: Generate installer bitmaps
        shell: pwsh
        run: |
          pip install Pillow --quiet
          python installer-win/build-bitmaps.py

      - name: Build Runner and Installer
        shell: pwsh
        run: |
          Set-Location installer-win
          & makensis runner.nsi
          & makensis "/DAPP_VERSION=$env:APP_VERSION" "/DAUTH_BASE_URL=$env:AUTH_BASE_URL" setup.nsi

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: EasyOKAPI-win-v${{ env.APP_VERSION }}
          path: installer-win/*.exe

  build-linux:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Inject version and auth URL into installer scripts
        run: |
          sed -i "s/__APP_VERSION__/v${{ env.APP_VERSION }}/g" installer-linux/install.sh
          sed -i "s|__AUTH_BASE_URL__|${{ env.AUTH_BASE_URL }}|g" installer-linux/install.sh
          sed -i "s/__APP_VERSION__/v${{ env.APP_VERSION }}/g" installer-linux/install-1-deps-clone.sh
          sed -i "s|__AUTH_BASE_URL__|${{ env.AUTH_BASE_URL }}|g" installer-linux/install-1-deps-clone.sh

      - name: Build Linux tarball
        env:
          APP_VERSION: ${{ env.APP_VERSION }}
        run: |
          chmod +x ./installer-linux/build-tarball.sh
          ./installer-linux/build-tarball.sh

      - name: Upload tarball artifact
        uses: actions/upload-artifact@v4
        with:
          name: EasyOKAPI-linux-v${{ env.APP_VERSION }}
          path: "*.tar.gz"
