<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }}</title>
    <link rel="icon" href="{{ url_for('static', filename='ht.ico') }}">
    <style>
        :root {
            --bg: #312e81; --bg2: #1e1b4b; --fg: #e2e8f0; --muted: #a5b4fc;
            --accent: #6366f1; --accent-hi: #818cf8; --err: #fca5a5; --ok: #86efac;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0; min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: var(--fg);
            background: radial-gradient(1200px 600px at 70% -10%, #4338ca 0%, var(--bg) 45%, var(--bg2) 100%);
            display: flex; align-items: center; justify-content: center; padding: 24px;
        }
        .card {
            width: 100%; max-width: 460px;
            background: rgba(30, 27, 75, 0.72);
            border: 1px solid rgba(129, 140, 248, 0.25);
            border-radius: 16px; padding: 32px 28px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.45);
            backdrop-filter: blur(6px); text-align: center;
        }
        .logo { display: block; width: 88px; height: 88px; margin: 0 auto 14px; object-fit: contain; }
        h1 { font-size: 1.4rem; margin: 0 0 6px; }
        p.sub { color: var(--muted); margin: 0 0 22px; font-size: 0.92rem; line-height: 1.5; }
        button {
            width: 100%; margin-top: 6px; padding: 12px 14px; border: none;
            border-radius: 10px; background: var(--accent); color: #fff;
            font-size: 0.98rem; font-weight: 600; cursor: pointer; transition: background .15s;
        }
        button:hover:not(:disabled) { background: var(--accent-hi); }
        button:disabled { opacity: 0.6; cursor: progress; }
        .msg { margin-top: 16px; font-size: 0.9rem; min-height: 1.2em; line-height: 1.45; }
        .msg.error { color: var(--err); }
        .msg.ok { color: var(--ok); }
        a { color: var(--accent-hi); }
        .detail {
            margin-top: 16px; padding-top: 14px;
            border-top: 1px solid rgba(129, 140, 248, 0.22);
            font-size: 0.86rem; line-height: 1.55; color: var(--muted); text-align: left;
        }
        .detail p { margin: 0 0 10px; }
        .detail p:last-child { margin-bottom: 0; }
        .detail .what { color: var(--fg); }
        .diag {
            margin-top: 10px; font-size: 0.76rem; color: var(--muted);
            word-break: break-all; opacity: 0.8;
        }
    </style>
    {% include "_a11y_head.html" %}
</head>
<body>
    <main class="card">
        <img class="logo" id="brandMark" src="{{ url_for('static', filename='okapi-run.gif') }}"
             alt="EasyOKAPI" onerror="this.style.display='none'">
        <h1>Verify your license</h1>
        <p class="sub">EasyOKAPI needs to confirm your license online. We check
            automatically and continue the moment it is confirmed.</p>

        <button id="retryBtn" type="button" style="display:none">Check again</button>
        <div id="msg" class="msg" role="status" aria-live="polite">Checking…</div>

        <!-- Filled in only when a check fails: what went wrong, whose problem it
             is, an apology, and a pre-filled report to the developer. -->
        <div id="detail" class="detail" role="region" aria-label="Why verification failed" hidden>
            <p class="what" id="detailWhat"></p>
            <p id="detailFix"></p>
            <p>We are sorry for the interruption. If this keeps happening, please
                <a id="reportLink" href="mailto:{{ support_email }}">report it to the developer</a>
                and we will look into it.</p>
            <p class="diag" id="detailDiag"></p>
        </div>
    </main>

    <script>
        (function () {
            var brandMark = document.getElementById('brandMark');
            var btn = document.getElementById('retryBtn');
            var msg = document.getElementById('msg');
            var detail = document.getElementById('detail');
            var detailWhat = document.getElementById('detailWhat');
            var detailFix = document.getElementById('detailFix');
            var detailDiag = document.getElementById('detailDiag');
            var reportLink = document.getElementById('reportLink');

            // The okapi is the loading indicator: running while a check is in
            // flight, standing still once it stops. Reduced motion never gets the
            // GIF — CSS cannot pause its frames, so the choice is made here.
            var OKAPI_RUN = {{ url_for('static', filename='okapi-run.gif') | tojson }};
            var OKAPI_STILL = {{ url_for('static', filename='okapi.png') | tojson }};
            var STILL_ONLY = window.matchMedia
                && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
            if (STILL_ONLY) { brandMark.src = OKAPI_STILL; }

            var SUPPORT_EMAIL = {{ support_email | tojson }};
            var APP_VERSION = {{ app_version | tojson }};

            // A failed check has two very different causes, and telling the user
            // the wrong one wastes their time: "check your connection" is useless
            // advice when their connection is fine and our service is down. The
            // server classifies the failure (src/activation.py); this table only
            // renders it.
            var REASONS = {
                no_internet: {
                    what: 'This computer does not appear to have an internet connection.',
                    fix: 'Reconnect to Wi-Fi or plug in the network cable, then click "Check again". Your measurements and files are untouched.'
                },
                dns_failure: {
                    what: 'This computer is online, but it cannot look up our license server\u2019s address.',
                    fix: 'A DNS setting, VPN, proxy or firewall on this network is most likely blocking it. Try another network, or ask your IT team to allow the address below.'
                },
                service_down: {
                    what: 'Your internet connection is working \u2014 our license service is the part that is not responding.',
                    fix: 'This one is on us, and nothing on this computer can fix it. Please try again in a few minutes; it is usually short-lived.'
                },
                no_token: {
                    what: 'No license is stored on this computer, so there is nothing to verify.',
                    fix: 'Re-run the installer or activate the app again with your license e-mail.'
                },
                unknown: {
                    what: 'The license check could not be completed, and we could not work out why.',
                    fix: 'Please try again in a few minutes.'
                }
            };

            function setMsg(t, kind) { msg.textContent = t || ''; msg.className = 'msg' + (kind ? ' ' + kind : ''); }
            function busy(on) {
                brandMark.src = (on && !STILL_ONLY) ? OKAPI_RUN : OKAPI_STILL;
                btn.style.display = on ? 'none' : 'block';
                btn.disabled = on;
                if (on) { detail.hidden = true; }
            }

            function mailtoHref(reason, d) {
                var lines = [
                    'What happened: license verification failed in EasyOKAPI.',
                    '',
                    'Reason reported by the app: ' + reason,
                    'App version: ' + (d.app_version || APP_VERSION),
                    'Service: ' + (d.service_url || '(unknown)'),
                    'Machine ID: ' + (d.hwid || '(unknown)'),
                    'Time: ' + new Date().toString(),
                    '',
                    'Anything else you can tell us (network, VPN, what you were doing):',
                    ''
                ];
                return 'mailto:' + SUPPORT_EMAIL
                    + '?subject=' + encodeURIComponent('EasyOKAPI license verification failed (' + reason + ')')
                    + '&body=' + encodeURIComponent(lines.join('\n'));
            }

            function showFailure(reason, d) {
                d = d || {};
                var info = REASONS[reason] || REASONS.unknown;
                detailWhat.textContent = info.what;
                detailFix.textContent = info.fix;
                detailDiag.textContent = 'Service: ' + (d.service_url || '\u2014')
                    + ' \u00b7 Version ' + (d.app_version || APP_VERSION)
                    + ' \u00b7 Reason: ' + reason;
                reportLink.href = mailtoHref(reason, d);
                detail.hidden = false;
            }

            function check() {
                busy(true); setMsg('Checking your license…');
                fetch('/license/recheck', { method: 'POST' })
                    .then(function (r) { return r.json(); })
                    .then(function (d) {
                        if (d.state === 'active') { setMsg('Verified! Starting EasyOKAPI…', 'ok'); window.location.href = '/'; return; }
                        if (d.state === 'revoked') { window.location.href = '/license-blocked'; return; }
                        if (d.state === 'banned') { window.location.href = '/license-banned'; return; }
                        busy(false);
                        var reason = d.reason || 'unknown';
                        setMsg(reason === 'service_down'
                            ? 'Could not verify — our license service is unreachable right now.'
                            : 'Could not verify your license yet.', 'error');
                        showFailure(reason, d);
                    })
                    .catch(function () {
                        // The local app itself did not answer: no server verdict to
                        // classify, so report it as the inconclusive case.
                        busy(false);
                        setMsg('Could not run the license check.', 'error');
                        showFailure('unknown', {});
                    });
            }

            btn.addEventListener('click', check);
            check();  // auto-check on load
        })();
    </script>
</body>
</html>
