<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Goodbye</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f5f5f5;
            text-align: center;
        }
        body.light {
            background-color: #f5f5f5;
            color: #000000;
        }
        body.dark {
            background-color: #444444;
            color: #eeeeee;
        }
        body.light .goodbye-container {
            background-color: #ffffff;
            color: inherit;
            padding: 2rem;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            max-width: 500px;
        }
        body.dark .goodbye-container {
            background-color: #111111;
            color: inherit;
            padding: 2rem;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            max-width: 500px;
        }
        body.light h1 {
            color: #333;
        }
        body.dark h1 {
            color: #eeeeee;
        }
        body.light p {
            color: #666;
            margin-bottom: 1rem;
        }
        body.dark p {
            color: #aaaaaa;
        }
        .production-warning {
            color: #d32f2f;
            font-weight: bold;
            margin-top: 1.5rem;
            padding: 0.5rem;
            background-color: #ffebee;
            border-radius: 4px;
        }
        .icon {
            font-size: 4rem;
            margin-bottom: 1rem;
            color: #4CAF50;
        }
    </style>
</head>
<body class="{{ mode }}">
    <div class="goodbye-container">
        <div class="icon">✓</div>
        <h1>Server Shutdown Complete</h1>
        <p>The server has been successfully terminated.</p>
        
        {% if production_mode %}
        <div class="production-warning">
            Production Mode: Terminal window will close automatically
        </div>
        {% endif %}
        
        <p><small>This page will attempt to close in <span id="countdown">5</span> seconds.</small></p>
    </div>

    <script>
        // Countdown timer
        let seconds = 5;
        const countdownElement = document.getElementById('countdown');
        let productionMode = "{{ production_mode }}"; // This should be set in your Flask context
        productionMode = productionMode === 'True'; // Convert string to boolean
        const countdown = setInterval(() => {
            seconds--;
            countdownElement.textContent = seconds;
            
            if (seconds <= 0) {
                clearInterval(countdown);
                attemptClose();
            }
        }, 1000);

        function attemptClose() {
            if (productionMode) {
                // For production mode, we'll try more aggressively to close everything
                try {
                    // Try standard close
                    window.close();
                    
                    // Fallback for browsers that block window.close()
                    setTimeout(() => {
                        window.open('', '_self').close();
                        
                        // Final fallback
                        setTimeout(() => {
                            document.body.innerHTML = `
                                <div class="goodbye-container">
                                    <p>All processes terminated. You may now safely close this window.</p>
                                </div>
                            `;
                        }, 500);
                    }, 500);
                } catch (e) {
                    console.error("Error closing window:", e);
                }
            } else {
                // For development, just try to close the tab
                window.open('', '_self').close();
            }
        }
    </script>
</body>
</html>
