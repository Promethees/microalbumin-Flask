<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password — Easy OKAPI</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f0f4f1;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 4px 24px rgba(0,0,0,.1);
      width: 100%;
      max-width: 420px;
      overflow: hidden;
    }
    .card-header { background: #2d6a4f; padding: 28px 32px; }
    .card-header h1 { color: #fff; font-size: 20px; margin-bottom: 4px; }
    .card-header p  { color: #b7e4c7; font-size: 13px; }
    .card-body { padding: 28px 32px; }
    label { display: block; font-size: 13px; color: #444; font-weight: 600; margin-bottom: 6px; }
    input[type=password] {
      width: 100%; padding: 10px 14px;
      border: 1.5px solid #d1d5db; border-radius: 7px;
      font-size: 14px; color: #111; outline: none;
      transition: border-color .15s; margin-bottom: 18px;
    }
    input:focus { border-color: #2d6a4f; }
    button[type=submit] {
      width: 100%; padding: 11px;
      background: #2d6a4f; color: #fff;
      border: none; border-radius: 7px;
      font-size: 15px; font-weight: 600;
      cursor: pointer; transition: background .15s;
    }
    button[type=submit]:hover { background: #1b4332; }
    button[type=submit]:disabled { background: #74b49b; cursor: not-allowed; }
    .msg {
      margin-top: 14px; padding: 10px 14px;
      border-radius: 7px; font-size: 13px; display: none;
    }
    .msg.success { background: #d1fae5; color: #065f46; border: 1px solid #6ee7b7; }
    .msg.error   { background: #fee2e2; color: #991b1b; border: 1px solid #fca5a5; }
    .invalid-box {
      padding: 16px; background: #fee2e2;
      border: 1px solid #fca5a5; border-radius: 8px;
      color: #991b1b; font-size: 14px; margin-bottom: 16px;
    }
    .footer-link { text-align: center; margin-top: 20px; font-size: 13px; color: #666; }
    .footer-link a { color: #2d6a4f; text-decoration: none; font-weight: 600; }
    .footer-link a:hover { text-decoration: underline; }
    .hint { font-size: 12px; color: #6b7280; margin-top: -14px; margin-bottom: 18px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="card-header">
      <h1>Reset Password</h1>
      <p>Choose a new password for your account</p>
    </div>
    <div class="card-body">
      {% if valid %}
      <form id="reset-form" novalidate>
        <label for="password">New password</label>
        <input type="password" id="password" name="password"
               placeholder="At least 8 characters" required autocomplete="new-password">
        <p class="hint">Minimum 8 characters</p>

        <label for="confirm">Confirm new password</label>
        <input type="password" id="confirm" name="confirm"
               placeholder="Repeat your password" required autocomplete="new-password">

        <button type="submit" id="submit-btn">Set New Password</button>
        <div class="msg" id="msg"></div>
      </form>
      {% else %}
      <div class="invalid-box">
        This reset link is invalid or has expired.<br>
        Please request a new one.
      </div>
      {% endif %}
      <p class="footer-link"><a href="/account/forgot-password">Request a new reset link</a></p>
    </div>
  </div>

  {% if valid %}
  <script>
    const RESET_TOKEN = {{ token | tojson }};

    document.getElementById('reset-form').addEventListener('submit', async function(e) {
      e.preventDefault();
      const btn    = document.getElementById('submit-btn');
      const msg    = document.getElementById('msg');
      const pw     = document.getElementById('password').value;
      const confirm = document.getElementById('confirm').value;

      msg.style.display = 'none';

      if (pw.length < 8) {
        msg.style.display = 'block';
        msg.className = 'msg error';
        msg.textContent = 'Password must be at least 8 characters.';
        return;
      }
      if (pw !== confirm) {
        msg.style.display = 'block';
        msg.className = 'msg error';
        msg.textContent = 'Passwords do not match.';
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Saving…';

      try {
        const res = await fetch('/api/account/reset-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token: RESET_TOKEN, password: pw })
        });
        const data = await res.json();
        msg.style.display = 'block';
        if (res.ok) {
          msg.className = 'msg success';
          msg.innerHTML = data.message + ' <a href="/account/login" style="color:#065f46;font-weight:600;">Log in →</a>';
          document.getElementById('reset-form').querySelector('button').style.display = 'none';
        } else {
          msg.className = 'msg error';
          msg.textContent = data.message;
          btn.disabled = false;
          btn.textContent = 'Set New Password';
        }
      } catch (err) {
        msg.style.display = 'block';
        msg.className = 'msg error';
        msg.textContent = 'Network error. Please try again.';
        btn.disabled = false;
        btn.textContent = 'Set New Password';
      }
    });
  </script>
  {% endif %}
</body>
</html>
