<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log In — Easy OKAPI</title>
  <script>
    (function() {
      const saved = localStorage.getItem('theme');
      const dark = saved !== null ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
      if (dark) document.documentElement.classList.add('dark');
    })();
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #f3f4f6;
      --card-bg: rgba(255, 255, 255, 0.85);
      --card-border: rgba(255, 255, 255, 0.5);
      --text: #1f2937;
      --text-muted: #6b7280;
      --label: #374151;
      --input-bg: rgba(255, 255, 255, 0.8);
      --input-border: #e5e7eb;
      --shadow: 0 24px 64px rgba(0,0,0,0.12), 0 4px 16px rgba(0,0,0,0.06);
      --link: #6366f1;
      --divider: rgba(0,0,0,0.08);
    }
    html.dark {
      --bg: #111827;
      --card-bg: rgba(17, 24, 39, 0.85);
      --card-border: rgba(255, 255, 255, 0.08);
      --text: #f3f4f6;
      --text-muted: #9ca3af;
      --label: #d1d5db;
      --input-bg: rgba(31, 41, 55, 0.7);
      --input-border: rgba(255, 255, 255, 0.1);
      --shadow: 0 24px 64px rgba(0,0,0,0.5), 0 4px 16px rgba(0,0,0,0.3);
      --link: #a5b4fc;
      --divider: rgba(255,255,255,0.07);
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      position: relative;
      overflow: hidden;
      transition: background 0.3s, color 0.3s;
    }

    /* Animated background blobs */
    .blob {
      position: fixed;
      border-radius: 50%;
      filter: blur(72px);
      z-index: 0;
      animation: blob-float 9s ease-in-out infinite;
    }
    .blob-1 {
      width: 420px; height: 420px;
      background: rgba(99, 102, 241, 0.22);
      top: -140px; left: -100px;
    }
    .blob-2 {
      width: 320px; height: 320px;
      background: rgba(168, 85, 247, 0.18);
      bottom: -100px; right: -80px;
      animation-delay: -4.5s;
    }
    .blob-3 {
      width: 220px; height: 220px;
      background: rgba(45, 212, 191, 0.12);
      top: 50%; left: 55%;
      animation-delay: -2s;
    }
    @keyframes blob-float {
      0%, 100% { transform: translateY(0) scale(1); }
      50%       { transform: translateY(-24px) scale(1.06); }
    }

    /* Card */
    .card {
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      box-shadow: var(--shadow);
      width: 100%;
      max-width: 420px;
      position: relative;
      z-index: 1;
      overflow: hidden;
    }

    /* Header */
    .card-header {
      background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
      padding: 28px 32px 26px;
      position: relative;
      overflow: hidden;
    }
    .card-header::before {
      content: '';
      position: absolute;
      width: 180px; height: 180px;
      background: rgba(255,255,255,0.1);
      border-radius: 50%;
      top: -70px; right: -50px;
    }
    .card-header::after {
      content: '';
      position: absolute;
      width: 90px; height: 90px;
      background: rgba(255,255,255,0.07);
      border-radius: 50%;
      bottom: -24px; right: 72px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
      position: relative;
    }
    .brand-icon {
      width: 36px; height: 36px;
      background: rgba(255,255,255,0.2);
      border-radius: 9px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      flex-shrink: 0;
    }
    .brand-name {
      font-size: 14px;
      font-weight: 700;
      color: #fff;
      letter-spacing: -0.01em;
    }
    .brand-name em { font-style: normal; color: rgba(255,255,255,0.65); }

    .card-header h1 {
      color: #fff;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.03em;
      margin-bottom: 4px;
      position: relative;
    }
    .card-header p {
      color: rgba(255,255,255,0.7);
      font-size: 13px;
      position: relative;
    }

    /* Body */
    .card-body { padding: 28px 32px; }

    label {
      display: block;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--label);
      margin-bottom: 6px;
    }

    input[type=email],
    input[type=password] {
      width: 100%;
      padding: 11px 14px;
      background: var(--input-bg);
      border: 1.5px solid var(--input-border);
      border-radius: 10px;
      font-size: 14px;
      color: var(--text);
      outline: none;
      transition: border-color .2s, box-shadow .2s, background .2s;
      margin-bottom: 18px;
    }
    input::placeholder { color: var(--text-muted); }
    input:focus {
      border-color: #6366f1;
      box-shadow: 0 0 0 4px rgba(99,102,241,0.14);
    }

    .forgot-row {
      display: flex;
      justify-content: flex-end;
      margin-top: -10px;
      margin-bottom: 20px;
    }
    .forgot-row a {
      font-size: 12px;
      color: var(--link);
      text-decoration: none;
      font-weight: 600;
    }
    .forgot-row a:hover { text-decoration: underline; }

    button[type=submit] {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      letter-spacing: -0.01em;
      box-shadow: 0 4px 14px rgba(99,102,241,0.35);
      transition: opacity .15s, transform .15s, box-shadow .15s;
    }
    button[type=submit]:hover:not(:disabled) {
      opacity: 0.9;
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(99,102,241,0.45);
    }
    button[type=submit]:active:not(:disabled) { transform: translateY(0); }
    button[type=submit]:disabled { opacity: 0.5; cursor: not-allowed; }

    .msg {
      margin-top: 14px;
      padding: 11px 14px;
      border-radius: 9px;
      font-size: 13px;
      display: none;
    }
    .msg.success {
      background: rgba(16,185,129,0.1);
      color: #059669;
      border: 1px solid rgba(16,185,129,0.28);
    }
    .msg.error {
      background: rgba(239,68,68,0.1);
      color: #dc2626;
      border: 1px solid rgba(239,68,68,0.25);
    }
    html.dark .msg.success { color: #34d399; }
    html.dark .msg.error   { color: #f87171; }

    .download-box {
      display: none;
      margin-top: 18px;
      padding: 16px;
      background: rgba(16,185,129,0.08);
      border: 1px solid rgba(16,185,129,0.25);
      border-radius: 10px;
      font-size: 13px;
      color: #059669;
    }
    html.dark .download-box { color: #34d399; }
    .download-box code {
      display: block;
      margin-top: 8px;
      background: rgba(16,185,129,0.1);
      padding: 8px 10px;
      border-radius: 6px;
      font-family: monospace;
      font-size: 12px;
      word-break: break-all;
      color: inherit;
    }
    .go-btn {
      display: inline-block;
      margin-top: 14px;
      padding: 9px 20px;
      background: linear-gradient(135deg, #6366f1, #a855f7);
      color: #fff;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      text-decoration: none;
    }

    .divider {
      border: none;
      border-top: 1px solid var(--divider);
      margin: 22px 0;
    }

    .footer-link {
      text-align: center;
      font-size: 13px;
      color: var(--text-muted);
    }
    .footer-link a {
      color: var(--link);
      text-decoration: none;
      font-weight: 600;
    }
    .footer-link a:hover { text-decoration: underline; }

    .oauth-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 20px;
    }
    .oauth-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 11px 14px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      border: 1.5px solid var(--input-border);
      background: var(--input-bg);
      color: var(--text);
      transition: border-color .2s, box-shadow .2s, background .2s;
    }
    .oauth-btn:hover {
      border-color: #6366f1;
      box-shadow: 0 0 0 4px rgba(99,102,241,0.1);
    }
    .oauth-btn svg { flex-shrink: 0; }
    .oauth-divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 4px 0 20px;
      color: var(--text-muted);
      font-size: 12px;
    }
    .oauth-divider::before,
    .oauth-divider::after {
      content: '';
      flex: 1;
      border-top: 1px solid var(--divider);
    }
  </style>
</head>
<body>
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="blob blob-3"></div>

  <div class="card">
    <div class="card-header">
      <div class="brand">
        <div class="brand-icon">🔬</div>
        <div class="brand-name"><em>CB</em>Biotec · Easy OKAPI</div>
      </div>
      <h1>Welcome back</h1>
      <p>Log in to access your account</p>
    </div>

    <div class="card-body">
      <div id="oauth-msg" class="msg error" style="display:none;margin-bottom:14px;"></div>

      <div class="oauth-group">
        <a href="/auth/oauth/google" class="oauth-btn">
          <svg width="18" height="18" viewBox="0 0 18 18" xmlns="http://www.w3.org/2000/svg">
            <path d="M17.64 9.205c0-.639-.057-1.252-.164-1.841H9v3.481h4.844a4.14 4.14 0 0 1-1.796 2.716v2.259h2.908c1.702-1.567 2.684-3.875 2.684-6.615z" fill="#4285F4"/>
            <path d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18z" fill="#34A853"/>
            <path d="M3.964 10.71A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.71V4.958H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.042l3.007-2.332z" fill="#FBBC05"/>
            <path d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.958L3.964 6.29C4.672 4.163 6.656 3.58 9 3.58z" fill="#EA4335"/>
          </svg>
          Continue with Google
        </a>
        <a href="/auth/oauth/github" class="oauth-btn">
          <svg width="18" height="18" viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg" fill="currentColor">
            <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0 0 16 8c0-4.42-3.58-8-8-8z"/>
          </svg>
          Continue with GitHub
        </a>
      </div>

      <div class="oauth-divider">or</div>

      <form id="login-form" novalidate>
        <label for="email">Email address</label>
        <input type="email" id="email" name="email"
               placeholder="jane@example.com" required autocomplete="email">

        <label for="password">Password</label>
        <input type="password" id="password" name="password"
               placeholder="••••••••" required autocomplete="current-password">

        <div class="forgot-row">
          <a href="/account/forgot-password">Forgot password?</a>
        </div>

        <button type="submit" id="submit-btn">Log in</button>
        <div class="msg" id="msg"></div>
      </form>

      <div class="download-box" id="download-box">
        <strong>Download token generated.</strong> Your installer will use it automatically.<br>
        If installing manually, copy the token below:
        <code id="token-display"></code>
        <a id="go-to-app-btn" href="/" class="go-btn">Go to App →</a>
      </div>

      <hr class="divider">
      <p class="footer-link">Don't have an account? <a href="/account/signup">Sign up</a></p>
    </div>
  </div>

  <script>
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function(e) {
      if (!localStorage.getItem('theme')) {
        document.documentElement.classList.toggle('dark', e.matches);
      }
    });

    (function() {
      const params = new URLSearchParams(window.location.search);
      const err = params.get('oauth_error');
      if (err) {
        const el = document.getElementById('oauth-msg');
        el.textContent = err;
        el.style.display = 'block';
        window.history.replaceState({}, '', window.location.pathname);
      }
    })();

    document.getElementById('login-form').addEventListener('submit', async function(e) {
      e.preventDefault();
      const btn = document.getElementById('submit-btn');
      const msg = document.getElementById('msg');
      btn.disabled = true;
      btn.textContent = 'Logging in…';
      msg.style.display = 'none';
      document.getElementById('download-box').style.display = 'none';

      try {
        const res = await fetch('/api/account/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            email:    document.getElementById('email').value.trim(),
            password: document.getElementById('password').value
          })
        });
        const data = await res.json();
        if (res.ok) {
          window.location.href = '/';
        } else {
          msg.style.display = 'block';
          msg.className = 'msg error';
          msg.textContent = data.message || 'Login failed. Please try again.';
        }
      } catch (err) {
        msg.style.display = 'block';
        msg.className = 'msg error';
        msg.textContent = 'Network error. Please try again.';
      } finally {
        btn.disabled = false;
        btn.textContent = 'Log in';
      }
    });
  </script>
</body>
</html>
