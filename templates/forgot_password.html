<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password — Easy OKAPI</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f0f4f1;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 4px 24px rgba(0,0,0,.1);
      width: 100%;
      max-width: 420px;
      overflow: hidden;
    }
    .card-header { background: #2d6a4f; padding: 28px 32px; }
    .card-header h1 { color: #fff; font-size: 20px; margin-bottom: 4px; }
    .card-header p  { color: #b7e4c7; font-size: 13px; }
    .card-body { padding: 28px 32px; }
    label { display: block; font-size: 13px; color: #444; font-weight: 600; margin-bottom: 6px; }
    input[type=email] {
      width: 100%; padding: 10px 14px;
      border: 1.5px solid #d1d5db; border-radius: 7px;
      font-size: 14px; color: #111; outline: none;
      transition: border-color .15s; margin-bottom: 18px;
    }
    input:focus { border-color: #2d6a4f; }
    button[type=submit] {
      width: 100%; padding: 11px;
      background: #2d6a4f; color: #fff;
      border: none; border-radius: 7px;
      font-size: 15px; font-weight: 600;
      cursor: pointer; transition: background .15s;
    }
    button[type=submit]:hover { background: #1b4332; }
    button[type=submit]:disabled { background: #74b49b; cursor: not-allowed; }
    .msg {
      margin-top: 14px; padding: 10px 14px;
      border-radius: 7px; font-size: 13px; display: none;
    }
    .msg.success { background: #d1fae5; color: #065f46; border: 1px solid #6ee7b7; }
    .msg.error   { background: #fee2e2; color: #991b1b; border: 1px solid #fca5a5; }
    .footer-link { text-align: center; margin-top: 20px; font-size: 13px; color: #666; }
    .footer-link a { color: #2d6a4f; text-decoration: none; font-weight: 600; }
    .footer-link a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="card">
    <div class="card-header">
      <h1>Forgot Password</h1>
      <p>Enter your email and we'll send a reset link</p>
    </div>
    <div class="card-body">
      <form id="forgot-form" novalidate>
        <label for="email">Email address</label>
        <input type="email" id="email" name="email" placeholder="jane@example.com"
               required autocomplete="email">
        <button type="submit" id="submit-btn">Send Reset Link</button>
        <div class="msg" id="msg"></div>
      </form>
      <p class="footer-link"><a href="/account/login">← Back to Log In</a></p>
    </div>
  </div>

  <script>
    document.getElementById('forgot-form').addEventListener('submit', async function(e) {
      e.preventDefault();
      const btn = document.getElementById('submit-btn');
      const msg = document.getElementById('msg');
      btn.disabled = true;
      btn.textContent = 'Sending…';
      msg.style.display = 'none';

      try {
        const res = await fetch('/api/account/forgot-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: document.getElementById('email').value.trim() })
        });
        const data = await res.json();
        msg.style.display = 'block';
        msg.className = res.ok ? 'msg success' : 'msg error';
        msg.textContent = data.message;
        if (res.ok) {
          document.getElementById('forgot-form').reset();
          btn.textContent = 'Sent';
        } else {
          btn.disabled = false;
          btn.textContent = 'Send Reset Link';
        }
      } catch (err) {
        msg.style.display = 'block';
        msg.className = 'msg error';
        msg.textContent = 'Network error. Please try again.';
        btn.disabled = false;
        btn.textContent = 'Send Reset Link';
      }
    });
  </script>
</body>
</html>
