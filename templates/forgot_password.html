<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password — Easy OKAPI</title>
  <script>
    (function() {
      const saved = localStorage.getItem('theme');
      const dark = saved !== null ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
      if (dark) document.documentElement.classList.add('dark');
    })();
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #f3f4f6;
      --card-bg: rgba(255, 255, 255, 0.85);
      --card-border: rgba(255, 255, 255, 0.5);
      --text: #1f2937;
      --text-muted: #6b7280;
      --label: #374151;
      --input-bg: rgba(255, 255, 255, 0.8);
      --input-border: #e5e7eb;
      --shadow: 0 24px 64px rgba(0,0,0,0.12), 0 4px 16px rgba(0,0,0,0.06);
      --link: #6366f1;
      --divider: rgba(0,0,0,0.08);
    }
    html.dark {
      --bg: #111827;
      --card-bg: rgba(17, 24, 39, 0.85);
      --card-border: rgba(255, 255, 255, 0.08);
      --text: #f3f4f6;
      --text-muted: #9ca3af;
      --label: #d1d5db;
      --input-bg: rgba(31, 41, 55, 0.7);
      --input-border: rgba(255, 255, 255, 0.1);
      --shadow: 0 24px 64px rgba(0,0,0,0.5), 0 4px 16px rgba(0,0,0,0.3);
      --link: #a5b4fc;
      --divider: rgba(255,255,255,0.07);
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      position: relative;
      overflow: hidden;
      transition: background 0.3s, color 0.3s;
    }

    .blob {
      position: fixed;
      border-radius: 50%;
      filter: blur(72px);
      z-index: 0;
      animation: blob-float 9s ease-in-out infinite;
    }
    .blob-1 {
      width: 420px; height: 420px;
      background: rgba(99, 102, 241, 0.22);
      top: -140px; left: -100px;
    }
    .blob-2 {
      width: 320px; height: 320px;
      background: rgba(168, 85, 247, 0.18);
      bottom: -100px; right: -80px;
      animation-delay: -4.5s;
    }
    @keyframes blob-float {
      0%, 100% { transform: translateY(0) scale(1); }
      50%       { transform: translateY(-24px) scale(1.06); }
    }

    .card {
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      box-shadow: var(--shadow);
      width: 100%;
      max-width: 420px;
      position: relative;
      z-index: 1;
      overflow: hidden;
    }

    .card-header {
      background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
      padding: 28px 32px 26px;
      position: relative;
      overflow: hidden;
    }
    .card-header::before {
      content: '';
      position: absolute;
      width: 180px; height: 180px;
      background: rgba(255,255,255,0.1);
      border-radius: 50%;
      top: -70px; right: -50px;
    }
    .card-header::after {
      content: '';
      position: absolute;
      width: 90px; height: 90px;
      background: rgba(255,255,255,0.07);
      border-radius: 50%;
      bottom: -24px; right: 72px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
      position: relative;
    }
    .brand-icon {
      width: 36px; height: 36px;
      background: rgba(255,255,255,0.2);
      border-radius: 9px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      flex-shrink: 0;
    }
    .brand-name {
      font-size: 14px;
      font-weight: 700;
      color: #fff;
      letter-spacing: -0.01em;
    }
    .brand-name em { font-style: normal; color: rgba(255,255,255,0.65); }

    .card-header h1 {
      color: #fff;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.03em;
      margin-bottom: 4px;
      position: relative;
    }
    .card-header p {
      color: rgba(255,255,255,0.7);
      font-size: 13px;
      position: relative;
    }

    .card-body { padding: 28px 32px; }

    label {
      display: block;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--label);
      margin-bottom: 6px;
    }

    input[type=email] {
      width: 100%;
      padding: 11px 14px;
      background: var(--input-bg);
      border: 1.5px solid var(--input-border);
      border-radius: 10px;
      font-size: 14px;
      color: var(--text);
      outline: none;
      transition: border-color .2s, box-shadow .2s, background .2s;
      margin-bottom: 18px;
    }
    input::placeholder { color: var(--text-muted); }
    input:focus {
      border-color: #6366f1;
      box-shadow: 0 0 0 4px rgba(99,102,241,0.14);
    }

    button[type=submit] {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      letter-spacing: -0.01em;
      box-shadow: 0 4px 14px rgba(99,102,241,0.35);
      transition: opacity .15s, transform .15s, box-shadow .15s;
    }
    button[type=submit]:hover:not(:disabled) {
      opacity: 0.9;
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(99,102,241,0.45);
    }
    button[type=submit]:active:not(:disabled) { transform: translateY(0); }
    button[type=submit]:disabled { opacity: 0.5; cursor: not-allowed; }

    .msg {
      margin-top: 14px;
      padding: 11px 14px;
      border-radius: 9px;
      font-size: 13px;
      display: none;
    }
    .msg.success {
      background: rgba(16,185,129,0.1);
      color: #059669;
      border: 1px solid rgba(16,185,129,0.28);
    }
    .msg.error {
      background: rgba(239,68,68,0.1);
      color: #dc2626;
      border: 1px solid rgba(239,68,68,0.25);
    }
    html.dark .msg.success { color: #34d399; }
    html.dark .msg.error   { color: #f87171; }

    .divider {
      border: none;
      border-top: 1px solid var(--divider);
      margin: 22px 0;
    }

    .footer-link {
      text-align: center;
      font-size: 13px;
      color: var(--text-muted);
    }
    .footer-link a {
      color: var(--link);
      text-decoration: none;
      font-weight: 600;
    }
    .footer-link a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>

  <div class="card">
    <div class="card-header">
      <div class="brand">
        <div class="brand-icon">🔬</div>
        <div class="brand-name"><em>CB</em>Biotec · Easy OKAPI</div>
      </div>
      <h1>Reset password</h1>
      <p>We'll send a reset link to your email</p>
    </div>

    <div class="card-body">
      <form id="forgot-form" novalidate>
        <label for="email">Email address</label>
        <input type="email" id="email" name="email"
               placeholder="jane@example.com" required autocomplete="email">

        <button type="submit" id="submit-btn">Send Reset Link</button>
        <div class="msg" id="msg"></div>
      </form>

      <hr class="divider">
      <p class="footer-link"><a href="/account/login">← Back to Log In</a></p>
    </div>
  </div>

  <script>
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function(e) {
      if (!localStorage.getItem('theme')) {
        document.documentElement.classList.toggle('dark', e.matches);
      }
    });

    document.getElementById('forgot-form').addEventListener('submit', async function(e) {
      e.preventDefault();
      const btn = document.getElementById('submit-btn');
      const msg = document.getElementById('msg');
      btn.disabled = true;
      btn.textContent = 'Sending…';
      msg.style.display = 'none';

      try {
        const res = await fetch('/api/account/forgot-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: document.getElementById('email').value.trim() })
        });
        const data = await res.json();
        msg.style.display = 'block';
        msg.className = res.ok ? 'msg success' : 'msg error';
        msg.textContent = data.message;
        if (res.ok) {
          this.reset();
          btn.textContent = 'Sent ✓';
        } else {
          btn.disabled = false;
          btn.textContent = 'Send Reset Link';
        }
      } catch (err) {
        msg.style.display = 'block';
        msg.className = 'msg error';
        msg.textContent = 'Network error. Please try again.';
        btn.disabled = false;
        btn.textContent = 'Send Reset Link';
      }
    });
  </script>
</body>
</html>
